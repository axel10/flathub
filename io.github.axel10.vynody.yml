id: io.github.axel10.vynody
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: vynody
rename-icon: io.github.axel10.vynody

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-music
  - --talk-name=org.mpris.MediaPlayer2.Player
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem.*
  - --own-name=org.freedesktop.StatusNotifierItem.*
  - --own-name=org.fluttertray.*

modules:
  - name: rust-env
    buildsystem: simple
    build-commands:
      - echo "Setting up Rust build environment"
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin

  - flutter-sdk-3.44.6.json
  - name: vynody
    buildsystem: simple
    build-options:
      append-path: /run/build/vynody/flatpak-bin:/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin:/var/lib/flutter/bin:/var/lib/flutter/bin/cache/dart-sdk/bin
      env:
        CARGO_HOME: /run/build/vynody/cargo
        CARGO_NET_OFFLINE: 'true'
        PUB_CACHE: /run/build/vynody/.pub-cache
        FLUTTER_ROOT: /var/lib/flutter
        CC: clang
        CXX: clang++
    build-commands:
      # Prepare FFmpeg binaries (extracted into build directory to prevent download script from running)
      - mkdir -p audio_core/build/ffmpeg-linux/install
      - tar -xzf ffmpeg_lib_linux.tar.gz -C audio_core/build/ffmpeg-linux/install
      
      # Prepare flutter_taglib prebuilt binary (placed in pub-cache to prevent build.dart download script from running)
      - mkdir -p .pub-cache/git/flutter_taglib-615fed19b777e170b846ddf913f2ae76c79d3e4b/.dart_tool/flutter_taglib/prebuilt
      - cp libflutter_taglib_linux_x64.so .pub-cache/git/flutter_taglib-615fed19b777e170b846ddf913f2ae76c79d3e4b/.dart_tool/flutter_taglib/prebuilt/libflutter_taglib_native.so

      # Convert git cache working trees to bare git repositories required by pub
      - for dir in /run/build/vynody/.pub-cache/git/cache/*; do if [ -d "$dir" ] && [ ! -d "$dir/objects" ]; then git clone --bare "$dir" "${dir}_tmp" && rm -rf "$dir" && mv "${dir}_tmp" "$dir"; fi; done

      # Fast offline pub get using pubspec.lock
      - flutter pub get --offline

      # GNOME's Rust SDK does not ship rustup, while Cargokit invokes it even
      # for the already-installed native Linux target.
      - chmod +x flatpak-bin/rustup

      # Cargokit compiles Dart build tools for its Rust plugins during CMake.
      # They must resolve from the preloaded pub cache inside Flatpak.
      - sed -i 's/pub get --no-precompile/pub get --offline --no-precompile/g' audio_core/cargokit/run_build_tool.sh

      # Run codegen (freezed, drift, json_serializable)
      - flutter pub run build_runner build --delete-conflicting-outputs
      
      # Build flutter linux bundle offline
      - export CC=clang CXX=clang++ && flutter -v build linux --release
      
      # Copy final build bundle to Flatpak app directory
      - mkdir -p /app/bin /app/lib /app/share/applications /app/share/metainfo /app/share/icons/hicolor/512x512/apps
      - cp -r build/linux/x64/release/bundle/* /app/

      # Create launch wrapper in /app/bin because flatpak-builder expects command at /app/bin/vynody
      - echo '#!/bin/sh' > /app/bin/vynody
      - echo 'exec /app/vynody "$@"' >> /app/bin/vynody
      - chmod +x /app/bin/vynody
      
      # Install integration files
      - cp io.github.axel10.vynody.desktop /app/share/applications/io.github.axel10.vynody.desktop
      - cp io.github.axel10.vynody.metainfo.xml /app/share/metainfo/io.github.axel10.vynody.metainfo.xml
      - cp io.github.axel10.vynody.png /app/share/icons/hicolor/512x512/apps/io.github.axel10.vynody.png

    sources:
      - type: inline
        dest: flatpak-bin
        dest-filename: rustup
        contents: |
          #!/bin/sh
          case "$1" in
            toolchain)
              printf '%s\n' stable
              ;;
            target)
              printf '%s\n' x86_64-unknown-linux-gnu
              ;;
            run)
              shift 2
              exec "$@"
              ;;
            *)
              echo "Unsupported rustup command: $*" >&2
              exit 1
              ;;
          esac
      - type: git
        url: https://github.com/axel10/vynody.git
        branch: main
        commit: 9b7c1ca4587f26fe7b047d2519b3d8181a1e0738
      - type: file
        url: https://github.com/axel10/audio_core/releases/download/0.6/ffmpeg_lib_linux.tar.gz
        sha256: 256593a6acaf54b6e0252aae96051246a0d400bc673cf02e32fafd2d24880d6c
        dest-filename: ffmpeg_lib_linux.tar.gz
      - type: file
        url: https://github.com/axel10/flutter_taglib/releases/download/desktop-binaries-v1.4.0/libflutter_taglib_linux_x64.so
        sha256: 1e6a3076e415f13ff20281c3d0fde273eb0a327f4e6127a1375861ce72d28fdb
        dest-filename: libflutter_taglib_linux_x64.so
      - type: file
        path: io.github.axel10.vynody.desktop
      - type: file
        path: io.github.axel10.vynody.metainfo.xml
      - type: file
        path: io.github.axel10.vynody.png
      
      # Include pub-sources.json and cargo-sources.json generated via the helper script
      - cargo-sources.json
      - pub-sources.json
      - pubspec-sources.json
      - cargokit-pub-sources.json

